# oath.wicket.cloud landing.
# Apply: wicketctl workload apply aulos --file workloads/oath/workload.toml --confirm
#
# Stable id: keep the existing public workload.

schema = "wicket.workload/v0"

[workload]
id = "wl-b6703b0fa806"
name = "oath"

[[containers]]
name = "web"
image = "registry.wicket.cloud/oath-landing:latest"
ports = [{ name = "http" }]

[[routes]]
host = "oath.wicket.cloud"
container = "web"
port = "http"

[[routes]]
host = "oath.moonlight.pm"
container = "web"
port = "http"

