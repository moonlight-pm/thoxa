# Project-scoped Grok settings (committed).
# Trusted local worktree: local engineering work without per-call prompts.
# Destructive / shared-state ops stay denied below (deny always wins).
# Docs: ~/.grok/docs/user-guide/22-permissions-and-safety.md
#
# Note: permission rules are loaded at session start — restart Grok to apply.
#
# Whitelist source (2026-07-19): mined ThoxaNative (now Thoxa) session
# permission_resolved events. Real user waits (wait_ms > 50) were exclusively
# run_terminal_command; file tools auto-resolved. Approved shells included
# cargo/git/cd pipelines, python3, rg, xxd, which, rustc, find/ls/cat family,
# and ./target binaries.

[permission]
allow = [
  # --- All tools that appeared in prior sessions (always allowed) ---
  "Read",
  "Read(**)",
  "Read(/home/joshua/Workspace/**)",
  "Read(/home/joshua/.grok/**)",
  "Edit",
  "Edit(**)",
  "Edit(/home/joshua/Workspace/Thoxa/**)",
  "Write",
  "Write(**)",
  "Write(/home/joshua/Workspace/Thoxa/**)",
  "Grep",
  "Grep(**)",

  # Full local shell. Session history showed only bash needed interactive
  # approval once file tools were covered; bare Bash matches whole-command
  # forms (`cd … && cargo …`, heredocs, etc.) that prefix rules miss.
  # Still constrained by `deny` below (push, force-reset, rm -rf /).
  "Bash",
  "Bash(*)",

  # Explicit prefixes kept for documentation / tools that log rule names,
  # and in case a future version treats bare Bash differently.
  "Bash(git *)",
  "Bash(git commit *)",
  "Bash(git commit:*)",
  "Bash(git add *)",
  "Bash(git status *)",
  "Bash(git status)",
  "Bash(git diff *)",
  "Bash(git log *)",
  "Bash(git show *)",
  "Bash(git branch *)",
  "Bash(git rev-parse *)",
  "Bash(git ls-files *)",
  "Bash(git restore *)",
  "Bash(git checkout *)",
  "Bash(git switch *)",
  "Bash(git stash *)",
  "Bash(git merge *)",
  "Bash(git rebase *)",
  "Bash(git tag *)",
  "Bash(git remote *)",
  "Bash(git fetch *)",
  "Bash(git pull *)",
  "Bash(git init *)",
  "Bash(git check-ignore *)",
  "Bash(git rm *)",

  "Bash(cargo *)",
  "Bash(rustc *)",
  "Bash(cc *)",
  "Bash(clang *)",
  "Bash(clangd *)",
  "Bash(ar *)",
  "Bash(make *)",

  "Bash(python3 *)",
  "Bash(python *)",
  "Bash(rg *)",
  "Bash(grep *)",
  "Bash(xxd *)",
  "Bash(od *)",
  "Bash(hexdump *)",
  "Bash(which *)",
  "Bash(readlink *)",
  "Bash(dirname *)",
  "Bash(basename *)",
  "Bash(realpath *)",
  "Bash(file *)",

  "Bash(mkdir *)",
  "Bash(cp *)",
  "Bash(mv *)",
  "Bash(touch *)",
  "Bash(chmod *)",
  "Bash(ln *)",
  "Bash(install *)",
  "Bash(rm *)",
  "Bash(rmdir *)",
  "Bash(tee *)",
  "Bash(sed *)",
  "Bash(awk *)",
  "Bash(printf *)",
  "Bash(echo *)",
  "Bash(cat *)",
  "Bash(head *)",
  "Bash(tail *)",
  "Bash(wc *)",
  "Bash(sort *)",
  "Bash(uniq *)",
  "Bash(tr *)",
  "Bash(cut *)",
  "Bash(find *)",
  "Bash(ls *)",
  "Bash(pwd)",
  "Bash(pwd *)",
  "Bash(test *)",
  "Bash(true)",
  "Bash(false)",
  "Bash(cd *)",
  "Bash(env *)",
  "Bash(timeout *)",
  "Bash(nice *)",
  "Bash(stdbuf *)",
  "Bash(xargs *)",
  "Bash(sh *)",
  "Bash(bash *)",
  "Bash(zsh *)",

  # Linked conformance / smoke binaries under target/
  "Bash(./target/*)",
  "Bash(target/*)",
  "Bash(/home/joshua/Workspace/Thoxa/target/*)",
]

# deny always wins over allow. Keep shared-state / irreversible ops gated.
deny = [
  "Bash(rm -rf *)",
  "Bash(rm -rf /*)",
  "Bash(git push *)",
  "Bash(git push --force *)",
  "Bash(git push -f *)",
  "Bash(git reset --hard *)",
  "Bash(git clean -fd *)",
  "Bash(git clean -xfd *)",
]
