[workspace]
resolver = "2"
members = [
    "crates/compiler",
    "crates/make",
]
# Zed WASM extension is personal DX under extras/ — not a workspace member.
exclude = ["extras/zed"]
default-members = ["crates/compiler"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
