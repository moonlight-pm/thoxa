[package]
name = "thoxa"
version = "0.1.0"
edition = "2024"

[[test]]
name = "compile_test"
path = "tests/integration/compile_test.rs"

[dependencies]
logos = "0.14"
chumsky = "1.0.0-alpha.6"
cranelift = "0.104"
cranelift-native = "0.104"
cranelift-module = "0.104"
cranelift-jit = "0.104"
cranelift-object = "0.104"
target-lexicon = "0.12"
clap = { version = "4.5", features = ["derive"] }
object = { version = "0.32", features = ["write"] }

# Optimize for smaller symbol names in debug builds
[profile.dev]
split-debuginfo = "unpacked"

# Enable some optimizations in debug mode to reduce symbol sizes
[profile.dev.package."*"]
opt-level = 1
